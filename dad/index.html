<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="callai-version" content="1.0-dad" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b3d91" />
  <title>Call AI for Dad</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../icons/icon-192.png" />
  <link rel="icon" href="../icons/icon-192.png" />
  <style>
    :root {
      --bg: #0b3d91;
      --text: #fff;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      background: #000;
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    button#stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      padding: 0;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      display: block;
      transition: background-color .25s ease;
    }
    body[data-state="listening"] { --bg: #0d652d; }
    body[data-state="thinking"],
    body[data-state="reading"] { --bg: #8a5a00; }
    body[data-state="speaking"] { --bg: #174ea6; }
    body[data-state="camera"],
    body[data-state="countdown"] { --bg: #000; }
    body[data-state="error"] { --bg: #8a1c13; }
    body[data-state="listening"] #stage { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse {
      0%,100% { box-shadow: inset 0 0 0 0 rgba(255,255,255,0); }
      50% { box-shadow: inset 0 0 0 16px rgba(255,255,255,.12); }
    }
    #camVideo, #camShot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      background: #000;
    }
    #camShot { object-fit: contain; }
    #shade {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: stretch;
      padding: calc(1.2rem + var(--safe-t)) 1.2rem calc(1.6rem + var(--safe-b));
      background: linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,.15) 40%, rgba(0,0,0,.72) 100%);
      pointer-events: none;
      text-align: left;
    }
    #status {
      margin: 0 0 .6rem;
      font-size: clamp(1.7rem, 7vw, 2.6rem);
      font-weight: 800;
      line-height: 1.15;
      text-shadow: 0 2px 8px rgba(0,0,0,.55);
    }
    #caption {
      margin: 0 0 .7rem;
      font-size: clamp(1.2rem, 5vw, 1.85rem);
      font-weight: 700;
      line-height: 1.3;
      max-height: 42vh;
      overflow: auto;
      text-shadow: 0 2px 8px rgba(0,0,0,.55);
      -webkit-user-select: text;
      user-select: text;
    }
    #caption:empty { display: none; }
    #hint {
      margin: 0;
      font-size: clamp(1.05rem, 4vw, 1.4rem);
      font-weight: 700;
      line-height: 1.3;
      opacity: .95;
      text-shadow: 0 2px 8px rgba(0,0,0,.55);
    }
    #hint:empty { display: none; }
    #gear {
      position: fixed;
      top: calc(.55rem + var(--safe-t));
      right: .55rem;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #fff;
      opacity: .22;
      cursor: pointer;
      z-index: 5;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #gear:hover, #gear:focus { opacity: .9; }
    #gear svg { width: 24px; height: 24px; }
    #typeForm {
      display: none;
      position: fixed;
      left: 0; right: 0; bottom: 0;
      padding: .7rem .8rem calc(.8rem + var(--safe-b));
      gap: .5rem;
      background: rgba(0,0,0,.75);
      z-index: 4;
    }
    #typeForm.show { display: flex; }
    #typeForm input {
      flex: 1;
      font-size: 1.15rem;
      padding: .8rem .9rem;
      border-radius: 16px;
      border: 0;
      background: #fff;
      color: #111;
    }
    #typeForm button {
      font-size: 1.15rem;
      font-weight: 700;
      padding: .8rem 1rem;
      border-radius: 16px;
      border: 0;
      background: #1a73e8;
      color: #fff;
    }
    dialog {
      border: 0;
      border-radius: 16px;
      padding: 1.25rem;
      width: min(92vw, 26rem);
      color: #222;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }
    dialog::backdrop { background: rgba(0,0,0,.45); }
    dialog h2 { margin: 0 0 .75rem; font-size: 1.2rem; }
    dialog label { display: block; font-size: .9rem; font-weight: 600; margin: .8rem 0 .3rem; }
    dialog select, dialog input[type=text], dialog input[type=password], dialog input[type=range] {
      width: 100%; font-size: 1rem; padding: .55rem .6rem; border-radius: 10px; border: 1px solid #ccc; background: #fff;
    }
    dialog .row { display: flex; gap: .5rem; align-items: center; }
    dialog .small { font-size: .8rem; opacity: .7; margin: .3rem 0 0; }
    dialog .actions { display: flex; gap: .5rem; justify-content: flex-end; margin-top: 1.1rem; flex-wrap: wrap; }
    .pill { font-size: 1rem; padding: .7rem 1.1rem; border-radius: 999px; border: 0; background: #1a73e8; color: #fff; cursor: pointer; }
    .pill.ghost { background: #e8e8e8; color: #222; }
    .check { display: flex; gap: .5rem; align-items: center; font-weight: 400 !important; }
    [hidden] { display: none !important; }
  </style>
</head>
<body data-state="idle">
  <button id="gear" type="button" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6a.5.5 0 0 0 .1-.6l-1.9-3.3a.5.5 0 0 0-.6-.2l-2.4 1a7.3 7.3 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-3.8a.5.5 0 0 0-.5.4l-.4 2.6a7.3 7.3 0 0 0-1.7 1l-2.4-1a.5.5 0 0 0-.6.2L2.5 8.8a.5.5 0 0 0 .1.6l2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6a.5.5 0 0 0-.1.6l1.9 3.3c.1.2.4.3.6.2l2.4-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .2.3.4.5.4h3.8c.2 0 .5-.2.5-.4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.4 1c.2.1.5 0 .6-.2l1.9-3.3a.5.5 0 0 0-.1-.6L19.4 13ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/></svg>
  </button>
  <button id="stage" type="button" aria-label="Tap once to talk. Tap twice to read.">
    <video id="camVideo" autoplay playsinline muted hidden></video>
    <img id="camShot" alt="" hidden />
    <div id="shade">
      <p id="status">Tap once to talk</p>
      <p id="caption" aria-live="polite"></p>
      <p id="hint">Tap twice to read a letter or paper</p>
    </div>
  </button>
  <form id="typeForm" autocomplete="off">
    <input id="typeInput" type="text" placeholder="Type what you want to say…" aria-label="Type your message" />
    <button type="submit">Send</button>
  </form>
  <input id="filePick" type="file" accept="image/*" capture="environment" hidden />

  <dialog id="settings">
    <form method="dialog" id="settingsForm">
      <h2>Settings</h2>
      <label for="voiceSel">Voice</label>
      <div class="row">
        <select id="voiceSel"></select>
        <button type="button" class="pill ghost" id="testVoice">Test</button>
      </div>
      <label for="rate">Speaking speed <span id="rateVal"></span></label>
      <input id="rate" type="range" min="0.7" max="1.4" step="0.05" />
      <label class="check"><input type="checkbox" id="bargeIn" /> Let me interrupt while it talks</label>
      <label for="provider">AI brain</label>
      <select id="provider">
        <option value="free">Free AI (no key needed)</option>
        <option value="xai">xAI Grok (your own key)</option>
        <option value="gemini">Google Gemini (your own key)</option>
      </select>
      <div id="keyBox">
        <label for="apiKey" id="keyLabel">API key</label>
        <input id="apiKey" type="password" placeholder="Paste your key" autocomplete="off" spellcheck="false" />
        <label for="model">Model</label>
        <input id="model" type="text" spellcheck="false" />
        <p class="small">Your key is saved only in this browser and sent only to that AI company. It never goes to us.</p>
      </div>
      <div class="actions">
        <button type="button" class="pill ghost" id="clearKeys">Forget my keys</button>
        <button type="submit" class="pill" id="saveSettings">Done</button>
      </div>
    </form>
  </dialog>

  <script>
  (function () {
    'use strict';
    const $ = (id) => document.getElementById(id);
    const stage = $('stage'), statusEl = $('status'), captionEl = $('caption'), hintEl = $('hint');
    const video = $('camVideo'), shot = $('camShot'), filePick = $('filePick');
    const typeForm = $('typeForm'), typeInput = $('typeInput');

    const TAP_MS = 400;
    const LIMIT_MS = 60 * 60 * 1000; // generous 60 minutes of talk per day
    const TESS_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    const DEFAULT_MODELS = { xai: 'grok-4.7', gemini: 'gemini-flash-latest' };
    const IDLE_STATUS = 'Tap once to talk';
    const IDLE_HINT = 'Tap twice to read a letter or paper';
    const PHOTO_HINT = 'Tap once to ask about it. Tap twice to read something else.';

    const S = {
      get(k, d) { try { const v = localStorage.getItem('callai-' + k); return v === null ? d : v; } catch (e) { return d; } },
      set(k, v) { try { localStorage.setItem('callai-' + k, v); } catch (e) {} },
      del(k) { try { localStorage.removeItem('callai-' + k); } catch (e) {} }
    };
    const settings = {
      get provider() { return S.get('provider', 'free'); },
      get voice() { return S.get('voice', ''); },
      get rate() { return parseFloat(S.get('rate', '1')) || 1; },
      get bargeIn() { return S.get('bargein', '1') === '1'; },
      key(p) { return S.get('key-' + p, ''); },
      model(p) { return S.get('model-' + p, '') || DEFAULT_MODELS[p] || ''; }
    };

    function dayKey() {
      const d = new Date();
      return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
    }
    function getUsed() {
      try {
        const raw = localStorage.getItem('callai-dad-used');
        if (!raw) return { day: dayKey(), ms: 0 };
        const data = JSON.parse(raw);
        if (data.day !== dayKey()) return { day: dayKey(), ms: 0 };
        return data;
      } catch (e) { return { day: dayKey(), ms: 0 }; }
    }
    function setUsed(ms) {
      try { localStorage.setItem('callai-dad-used', JSON.stringify({ day: dayKey(), ms })); } catch (e) {}
    }
    function remaining() { return Math.max(0, LIMIT_MS - getUsed().ms); }

    // ---------- Voice output ----------
    const synth = window.speechSynthesis || null;
    let voices = [];
    let resumeTick = null;
    function scoreVoice(v) {
      const n = (v.name || '') + ' ' + (v.voiceURI || '');
      let s = 0;
      if (/^en[-_]US/i.test(v.lang)) s += 30; else if (/^en/i.test(v.lang)) s += 20; else return -1000;
      if (/natural|neural|online/i.test(n)) s += 50;
      if (/google/i.test(n)) s += 40;
      if (/premium|enhanced/i.test(n)) s += 35;
      if (/samantha|ava|allison|aria|jenny|guy|zira|karen|daniel|serena|siri/i.test(n)) s += 20;
      if (/compact|espeak|novelty|whisper|bad news|bells|bubbles|cellos|zarvox|trinoids|albert|jester|organ|superstar|boing|deranged|hysterical|wobble/i.test(n)) s -= 60;
      if (v.localService === false) s += 5;
      return s;
    }
    function englishVoices() {
      return voices.filter(v => /^en/i.test(v.lang || '')).sort((a, b) => scoreVoice(b) - scoreVoice(a));
    }
    function pickVoice() {
      const list = englishVoices();
      const want = settings.voice;
      if (want) { const v = voices.find(v => v.voiceURI === want || v.name === want); if (v) return v; }
      return list[0] || null;
    }
    function loadVoices() {
      if (!synth) return;
      voices = synth.getVoices() || [];
      fillVoiceSelect();
    }
    function fillVoiceSelect() {
      const voiceSel = $('voiceSel');
      if (!voiceSel) return;
      const list = englishVoices();
      const cur = pickVoice();
      voiceSel.innerHTML = '';
      if (!list.length) {
        const o = document.createElement('option');
        o.textContent = synth ? 'Default voice' : 'No voices available';
        voiceSel.appendChild(o);
        return;
      }
      list.forEach(v => {
        const o = document.createElement('option');
        o.value = v.voiceURI || v.name;
        o.textContent = v.name + ' (' + v.lang + ')';
        if (cur && (cur.voiceURI || cur.name) === o.value) o.selected = true;
        voiceSel.appendChild(o);
      });
    }
    if (synth) {
      loadVoices();
      if ('onvoiceschanged' in synth) synth.onvoiceschanged = loadVoices;
      else if (synth.addEventListener) synth.addEventListener('voiceschanged', loadVoices);
    }
    function splitSentences(text) {
      const parts = String(text).replace(/([.!?]+["')\]]*)\s+/g, '$1\u0001').split('\u0001');
      return parts.map(s => s.trim()).filter(Boolean);
    }
    function unlockSpeech() {
      if (synth && window.SpeechSynthesisUtterance) {
        try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; synth.speak(u); } catch (e) {}
      }
    }
    function startResumeWatch() {
      stopResumeWatch();
      if (!synth) return;
      resumeTick = setInterval(() => { try { if (synth.speaking && synth.paused) synth.resume(); } catch (e) {} }, 8000);
    }
    function stopResumeWatch() {
      if (resumeTick) { clearInterval(resumeTick); resumeTick = null; }
    }
    let speakingText = '';
    function speak(text, onDone) {
      if (!synth || !window.SpeechSynthesisUtterance) { onDone && onDone(); return; }
      synth.cancel();
      speakingText = text;
      const chunks = splitSentences(text);
      const voice = pickVoice();
      let i = 0, finished = false;
      const done = () => {
        if (finished) return;
        finished = true;
        speakingText = '';
        stopResumeWatch();
        onDone && onDone();
      };
      speak.cancelCurrent = () => { finished = true; speakingText = ''; stopResumeWatch(); try { synth.cancel(); } catch (e) {} };
      startResumeWatch();
      const next = () => {
        if (finished) return;
        if (i >= chunks.length) return done();
        const u = new SpeechSynthesisUtterance(chunks[i++]);
        if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-US';
        u.rate = settings.rate;
        const watchdog = setTimeout(next, Math.max(2500, (u.text.length / 10) * 1000 / (settings.rate || 1) + 1500));
        const step = () => { clearTimeout(watchdog); next(); };
        u.onend = step;
        u.onerror = step;
        try { synth.speak(u); } catch (e) { step(); }
      };
      next();
    }
    function stopSpeaking() { if (speak.cancelCurrent) speak.cancelCurrent(); else if (synth) { try { synth.cancel(); } catch (e) {} } stopResumeWatch(); }

    // ---------- Listening ----------
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
    let rec = null, recActive = false, micBlocked = false;
    function setupRec() {
      if (!SR) return null;
      const r = new SR();
      r.lang = 'en-US';
      r.continuous = false;
      r.interimResults = true;
      r.maxAlternatives = 1;
      r.onstart = () => { recActive = true; };
      r.onresult = onRecResult;
      r.onerror = (e) => {
        const err = e && e.error;
        if (err === 'not-allowed' || err === 'service-not-allowed') {
          micBlocked = true;
          showType(true);
          setHint('Microphone is blocked. Allow the mic for this site, or type below.');
          speak('Please allow the microphone, or I cannot hear you. You can also type at the bottom of the screen.');
        } else if (err === 'network') {
          showType(true);
          setHint('Speech recognition needs an internet connection. You can type below.');
        }
      };
      r.onend = () => {
        recActive = false;
        if (open && !micBlocked && (state === 'listening' || (state === 'speaking' && settings.bargeIn))) {
          setTimeout(ensureListening, 150);
        }
      };
      return r;
    }
    function ensureListening() {
      if (!open || !SR || micBlocked || recActive) return;
      if (!rec) rec = setupRec();
      try { rec.start(); recActive = true; } catch (e) { /* already started */ }
    }
    function stopListening() {
      if (rec && recActive) { try { rec.abort(); } catch (e) {} }
      recActive = false;
    }
    function norm(s) { return (s || '').toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim(); }
    function isEcho(heard) {
      const h = norm(heard);
      if (!h) return true;
      const said = norm(speakingText || lastReply);
      if (said && said.indexOf(h) !== -1) return true;
      const sw = new Set(said.split(' '));
      const hw = h.split(' ');
      const overlap = hw.filter(w => sw.has(w)).length / hw.length;
      return hw.length >= 2 && overlap >= 0.8;
    }
    function onRecResult(e) {
      let finalText = '', interim = '';
      for (let i = e.resultIndex || 0; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
      }
      const heard = (finalText || interim).trim();
      if (!heard) return;
      if (state === 'thinking' || state === 'reading' || state === 'countdown' || state === 'camera') return;
      if (state === 'speaking') {
        if (isEcho(heard)) return;
        stopSpeaking();
        setState('listening');
        setStatus('Listening…');
      }
      if (finalText.trim()) {
        setHint('');
        userSaid(finalText.trim());
      } else {
        setHint(interim.trim() + '…');
      }
    }

    // ---------- Conversation + AI ----------
    const SYSTEM_PROMPT = "You are Call AI, a warm, patient voice assistant talking with an older man. " +
      "Talk like a helpful person on the phone. Keep every answer short: one to three spoken sentences. " +
      "Use plain words only: no markdown, no lists, no emojis, no links, no special symbols. " +
      "If you didn't catch something, ask a quick follow-up question. Do not ask him to press 1 or 2.";
    const MAIL_PROMPT = "You help an older person who just pointed their phone camera at something, usually a piece of mail. " +
      "He wants a short spoken summary right away. Do not ask whether to read it word for word. " +
      "Reply in exactly this format, four lines, nothing else:\n" +
      "KIND: JUNK or REAL or OTHER\nSCAM: YES or NO\nHEADLINE: one short sentence\nSHORT: two to four short sentences\n\n" +
      "How to sort it. JUNK means advertising: ads, offers, coupons, pre-approved or 'you may already qualify' credit offers, sweepstakes, " +
      "car warranty or insurance sales pitches, donation requests, anything addressed to Current Resident, and marketing dressed up to look urgent or official. " +
      "REAL means it matters: bills, statements, government letters (Social Security, SSDI, SSI, SNAP, Medicare, Medicaid, IRS, DMV), courts, bank, medical, pharmacy, " +
      "insurance, utility, jury duty, legal papers, personal letters, and post office notices like Return to Sender. " +
      "OTHER means it is not mail, like a pill bottle, a sign, a product or a screen. " +
      "Normal ads and credit card or loan offers from real companies are JUNK with SCAM: NO. " +
      "SCAM is YES only if it pushes for money, gift cards, personal information or an urgent call-back in a suspicious way, threatens arrest or shutoff from an unknown sender, or pretends to be the government or a bank.\n\n" +
      "HEADLINE: for REAL start with 'This is real mail:' then what it is and who it is from. " +
      "For JUNK start with 'This is junk mail:' then what it is selling in a few words, and end with 'You can toss it.' For OTHER say what it is in one sentence.\n" +
      "SHORT: only the facts in plain words: who it is from, what it is about, any amount due, the due date or deadline, and what they need to do. " +
      "The name after Dear or To is who the letter is for, not who sent it. The sender is usually the company or agency at the top. " +
      "If there is an amount due or a deadline, say they need to pay or respond by that date. Say 'Nothing to do' only for junk, or when nothing is owed and no reply is needed. " +
      "For JUNK write only: Nothing to do. If SCAM is YES, warn them not to call, pay or give any information. " +
      "Never read every line. Skip fine print, barcodes, account numbers and addresses. No markdown, lists or symbols except dollar signs.";

    const MAX_TURNS = 10;
    let history = [];
    let lastReply = '';
    let turnId = 0;
    let photo = null;

    function cleanReply(t) {
      if (!t) return '';
      t = String(t);
      t = t.split(/\n\s*(?:---+|\*\*Sponsor|\uD83C\uDF38)/)[0];
      t = t.split('\n').filter(l => !/pollinations\.ai/i.test(l)).join('\n');
      t = t.replace(/```[\s\S]*?```/g, ' ')
           .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
           .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
           .replace(/https?:\/\/\S+/g, '')
           .replace(/[*_`#>~|]+/g, '')
           .replace(/^\s*[-•]\s+/gm, '')
           .replace(/^\s*\d+\.\s+/gm, '')
           .replace(/\s+/g, ' ')
           .trim();
      return t;
    }
    async function fetchJSON(url, opts, ms) {
      const ctl = new AbortController();
      const to = setTimeout(() => ctl.abort(), ms || 30000);
      try {
        const r = await fetch(url, Object.assign({}, opts, { signal: ctl.signal }));
        if (!r.ok) { const err = new Error('HTTP ' + r.status); err.status = r.status; throw err; }
        return await r.json();
      } finally { clearTimeout(to); }
    }
    async function askFree(msgs) {
      msgs = msgs.map(m => Array.isArray(m.content) ? { role: m.role, content: m.content.filter(p => p.type === 'text').map(p => p.text).join(' ') } : m);
      const body = { model: 'openai', messages: msgs, private: true, referrer: 'call-ai' };
      try {
        const d = await fetchJSON('https://text.pollinations.ai/openai', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
        }, 30000);
        const c = d && d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
        if (c) return c;

        .map(m => (m.role === 'assistant' ? 'Assistant: ' : 'User: ') + m.content).join('\n').slice(-1500) + '\nAssistant:';

      const url = 'https://text.pollinations.ai/' + encodeURIComponent(convo) +
        '?model=openai&private=true&referrer=call-ai&system=' + encodeURIComponent(sys);
      const ctl = new AbortController();
      const to = setTimeout(() => ctl.abort(), 30000);
      try {
        const r = await fetch(url, { signal: ctl.signal });
        if (!r.ok) { const err = new Error('HTTP ' + r.status); err.status = r.status; throw err; }

    async function askXai(msgs, maxTokens) {

      const d = await fetchJSON('https://api.x.ai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },

    async function requestFile(msg, my) {

    function scaled(src, maxSide, gray) {

        const sc = document.createElement('script');

        sc.onload = () => window.Tesseract ? res(window.Tesseract) : rej(new Error('ocr-load'));

        short: get('SHORT')

    async function readPhoto(canvas, my) {

      setStatus('Reading…');
      setHint('Give me a moment.');

      video.hidden = true;

            const raw = await askAI([{ role: 'system', content: MAIL_PROMPT + ' Look at the photo.' },

    function presentPhoto(res, my, note) {

      bargeIn.checked = settings.bargeIn;
      syncKeyBox();
      if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
    }
    function saveSettings() {
      if (voiceSel.value) S.set('voice', voiceSel.value);
      S.set('rate', String(rate.value));
      S.set('provider', provider.value);
      S.set('bargein', bargeIn.checked ? '1' : '0');
      const p = provider.value;
      if (p !== 'free') {
        const k = apiKey.value.trim();
        if (k) S.set('key-' + p, k); else S.del('key-' + p);
        const m = model.value.trim();
        if (m && m !== DEFAULT_MODELS[p]) S.set('model-' + p, m); else S.del('model-' + p);
      }
    }
    $('gear').addEventListener('click', openSettings);
    $('gear').addEventListener('pointerup', (e) => e.stopPropagation());
    provider.addEventListener('change', syncKeyBox);
    rate.addEventListener('input', () => { rateVal.textContent = '(' + parseFloat(rate.value).toFixed(2) + 'x)'; });
    $('testVoice').addEventListener('click', () => {
      if (voiceSel.value) S.set('voice', voiceSel.value);
      S.set('rate', String(rate.value));
      speak('Hi, this is Call AI. Tap once to talk, or twice to read a letter.');
    });
    $('clearKeys').addEventListener('click', () => {
      S.del('key-xai'); S.del('key-gemini'); S.del('model-xai'); S.del('model-gemini');
      S.set('provider', 'free'); provider.value = 'free'; syncKeyBox();
    });
    $('settingsForm').addEventListener('submit', saveSettings);

    function canvasFromDataUrl(dataUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          c.width = img.naturalWidth; c.height = img.naturalHeight;
          c.getContext('2d').drawImage(img, 0, 0);
          resolve(c);
        };
        img.onerror = () => reject(new Error('bad-image'));
        img.src = dataUrl;
      });
    }

    window.DadAI = {
      version: '1.0-dad',
      TAP_MS,
      get state() { return state; },
      get mode() { return mode; },
      get open() { return open; },
      get lastIntent() { return lastIntent; },
      get pendingFilePick() { return pendingFilePick; },
      get statusText() { return statusEl.textContent; },
      get captionText() { return captionEl.textContent; },
      get hintText() { return hintEl.textContent; },
      get photo() { return photo ? { kind: photo.kind, scam: photo.scam, headline: photo.headline, short: photo.short, mode: photo.mode, text: photo.text } : null; },
      tap: onTap,
      singleTap: onSingleTap,
      doubleTap: onDoubleTap,
      parseMail,
      cleanOcr,
      ocrCanvas,
      async readTestImage(dataUrl) {
        const c = await canvasFromDataUrl(dataUrl);
        const my = ++camTurn;
        camOn = true;
        return readPhoto(c, my);
      }
    };
  })();
  </script>
  <noscript>
    <p style="padding:2rem;font-size:1.5rem;color:#fff;background:#0b3d91;">This page needs JavaScript to talk and read mail.</p>
  </noscript>
</body>
</html>
