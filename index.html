<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="callai-version" content="3.0-camera" />
  <title>Call AI</title>
  <style>
    :root {
      --bg: #f2f2f2;
      --btn: #1a73e8;
      --btn-on: #0b5cab;
      --text: #222;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
    }
    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      padding: 2rem 2rem 4rem;
    }
    button#talk {
      width: min(42vmin, 220px);
      height: min(42vmin, 220px);
      border: 0;
      border-radius: 50%;
      background: var(--btn);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(0,0,0,.18);
      display: grid;
      place-items: center;
      -webkit-tap-highlight-color: transparent;
      transition: box-shadow .2s, transform .2s;
    }
    button#talk[aria-pressed="true"] {
      background: var(--btn-on);
      box-shadow: 0 0 0 8px rgba(26,115,232,.25);
    }
    button#talk[data-state="listening"] { animation: pulse 1.6s ease-in-out infinite; }
    button#talk[data-state="speaking"] { box-shadow: 0 0 0 14px rgba(26,115,232,.30); }
    button#talk[data-state="thinking"] { transform: scale(.96); }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 8px rgba(26,115,232,.25); }
      50% { box-shadow: 0 0 0 18px rgba(26,115,232,.12); }
    }
    button#talk svg { width: 42%; height: 42%; }
    .label {
      font-size: clamp(1.25rem, 4vw, 1.75rem);
      font-weight: 700;
      margin: 0;
    }
    .status {
      min-height: 1.5em;
      font-size: 1rem;
      opacity: .75;
      text-align: center;
      max-width: 20rem;
      margin: 0;
    }
    #captions {
      width: 100%;
      max-width: 26rem;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      font-size: 1rem;
      line-height: 1.35;
    }
    #captions:empty { display: none; }
    .cap { padding: .55rem .8rem; border-radius: 14px; max-width: 90%; }
    .cap.you { align-self: flex-end; background: #dfe9fb; }
    .cap.ai { align-self: flex-start; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .cap.interim { opacity: .6; font-style: italic; }
    .cap.err { align-self: center; background: #fdecea; color: #8a1c13; font-size: .92rem; }
    #typeForm { display: none; width: 100%; max-width: 26rem; gap: .5rem; }
    #typeForm.show { display: flex; }
    #typeForm input {
      flex: 1; font-size: 1rem; padding: .7rem .9rem; border-radius: 999px;
      border: 1px solid #ccc; background: #fff;
    }
    #typeForm button, .pill {
      font-size: 1rem; padding: .7rem 1.1rem; border-radius: 999px; border: 0;
      background: var(--btn); color: #fff; cursor: pointer;
    }
    .hint { font-size: .85rem; opacity: .7; text-align: center; max-width: 24rem; margin: 0; }
    .hint:empty { display: none; }
    .meta {
      margin: 0;
      padding: 0 1rem 1rem;
      text-align: center;
      font-size: .85rem;
      opacity: .55;
      pointer-events: none;
    }
    #gear {
      position: fixed; top: .8rem; right: .8rem; width: 44px; height: 44px;
      border-radius: 50%; border: 0; background: transparent; cursor: pointer;
      opacity: .55; color: var(--text);
    }
    #gear:hover { opacity: .9; }
    #gear svg { width: 24px; height: 24px; }
    dialog {
      border: 0; border-radius: 16px; padding: 1.25rem; width: min(92vw, 26rem);
      box-shadow: 0 20px 50px rgba(0,0,0,.25); color: var(--text);
    }
    dialog::backdrop { background: rgba(0,0,0,.35); }
    dialog h2 { margin: 0 0 .75rem; font-size: 1.2rem; }
    dialog label { display: block; font-size: .9rem; font-weight: 600; margin: .8rem 0 .3rem; }
    dialog select, dialog input[type=text], dialog input[type=password] {
      width: 100%; font-size: 1rem; padding: .55rem .6rem; border-radius: 10px; border: 1px solid #ccc; background: #fff;
    }
    dialog .row { display: flex; gap: .5rem; align-items: center; }
    dialog .small { font-size: .8rem; opacity: .7; margin: .3rem 0 0; }
    dialog .actions { display: flex; gap: .5rem; justify-content: flex-end; margin-top: 1.1rem; flex-wrap: wrap; }
    .pill.ghost { background: #e8e8e8; color: var(--text); }
    .check { display: flex; gap: .5rem; align-items: center; font-weight: 400 !important; }
    [hidden] { display: none !important; }
    /* ---------- Camera ---------- */
    button#cam {
      width: min(86vw, 22rem); min-height: 88px; border: 0; border-radius: 24px;
      background: #0f9d58; color: #fff; font-size: 1.6rem; font-weight: 800; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: .7rem;
      box-shadow: 0 8px 22px rgba(0,0,0,.16); -webkit-tap-highlight-color: transparent;
    }
    button#cam[aria-pressed="true"] { background: #b3261e; }
    button#cam svg { width: 40px; height: 40px; }
    #camBox { width: 100%; max-width: 34rem; display: flex; flex-direction: column; gap: .7rem; align-items: stretch; }
    #camStage {
      position: relative; width: 100%; aspect-ratio: 3 / 4; max-height: 64vh; background: #000;
      border-radius: 20px; overflow: hidden; border: 0; padding: 0; cursor: pointer; display: block;
      -webkit-tap-highlight-color: transparent;
    }
    #camStage video, #camStage img { width: 100%; height: 100%; display: block; object-fit: cover; }
    #camStage img { object-fit: contain; background: #000; }
    #camTip {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 1rem .8rem; color: #fff; text-align: center;
      font-size: 1.3rem; font-weight: 800; background: linear-gradient(transparent, rgba(0,0,0,.8));
    }
    #verdict { font-size: 1.7rem; font-weight: 900; text-align: center; padding: .6rem; border-radius: 16px; margin: 0; }
    #verdict.junk { background: #fdecea; color: #8a1c13; }
    #verdict.real { background: #e6f4ea; color: #0d652d; }
    #verdict.other { background: #e8f0fe; color: #174ea6; }
    #verdict.scam { background: #8a1c13; color: #fff; }
    #choices { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; width: 100%; max-width: 26rem; }
    #choices button {
      min-height: 128px; border: 0; border-radius: 24px; color: #fff; cursor: pointer; font-size: 1.15rem; font-weight: 700;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3rem;
      box-shadow: 0 6px 18px rgba(0,0,0,.15); -webkit-tap-highlight-color: transparent;
    }
    #choices .num { font-size: 3.4rem; line-height: 1; font-weight: 900; }
    #c1 { background: #1a73e8; }
    #c2 { background: #5f6368; }
  </style>
</head>
<body>
  <button id="gear" type="button" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6a.5.5 0 0 0 .1-.6l-1.9-3.3a.5.5 0 0 0-.6-.2l-2.4 1a7.3 7.3 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-3.8a.5.5 0 0 0-.5.4l-.4 2.6a7.3 7.3 0 0 0-1.7 1l-2.4-1a.5.5 0 0 0-.6.2L2.5 8.8a.5.5 0 0 0 .1.6l2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6a.5.5 0 0 0-.1.6l1.9 3.3c.1.2.4.3.6.2l2.4-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .2.3.4.5.4h3.8c.2 0 .5-.2.5-.4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.4 1c.2.1.5 0 .6-.2l1.9-3.3a.5.5 0 0 0-.1-.6L19.4 13ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/></svg>
  </button>
  <main>
    <button id="talk" type="button" aria-pressed="false" aria-label="Live talk" data-state="idle">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Z" fill="currentColor"/>
        <path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.93V21H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.07A7 7 0 0 0 19 11Z" fill="currentColor"/>
      </svg>
    </button>
    <p class="label" id="label">Live talk</p>
    <p class="status" id="status">Tap to open. Tap again to close.</p>
    <p class="hint" id="hint"></p>
    <button id="cam" type="button" aria-pressed="false" aria-label="Camera">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9Zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>
      <span id="camLabel">Camera</span>
    </button>
    <div id="camBox" hidden>
      <button id="camStage" type="button" aria-label="Tap to read what the camera sees">
        <video id="camVideo" autoplay playsinline muted></video>
        <img id="camShot" alt="Your photo" hidden />
        <span id="camTip">Starting camera…</span>
      </button>
      <p id="verdict" hidden></p>
      <input id="filePick" type="file" accept="image/*" capture="environment" hidden />
    </div>
    <div id="choices" hidden>
      <button id="c1" type="button"><span class="num">1</span><span id="c1Text">Yes</span></button>
      <button id="c2" type="button"><span class="num">2</span><span id="c2Text">No</span></button>
    </div>
    <div id="captions" aria-live="polite"></div>
    <form id="typeForm" autocomplete="off">
      <input id="typeInput" type="text" placeholder="Type what you want to say…" aria-label="Type your message" />
      <button type="submit">Send</button>
    </form>
  </main>
  <p class="meta">Call AI · no login · 5 min/day (demo timer)</p>

  <dialog id="settings">
    <form method="dialog" id="settingsForm">
      <h2>Settings</h2>
      <label for="voiceSel">Voice</label>
      <div class="row">
        <select id="voiceSel"></select>
        <button type="button" class="pill ghost" id="testVoice">Test</button>
      </div>
      <label for="rate">Speaking speed <span id="rateVal"></span></label>
      <input id="rate" type="range" min="0.7" max="1.4" step="0.05" style="width:100%" />
      <label class="check"><input type="checkbox" id="bargeIn" /> Let me interrupt while it talks</label>
      <label for="provider">AI brain</label>
      <select id="provider">
        <option value="free">Free AI (no key needed)</option>
        <option value="xai">xAI Grok (your own key)</option>
        <option value="gemini">Google Gemini (your own key)</option>
      </select>
      <div id="keyBox">
        <label for="apiKey" id="keyLabel">API key</label>
        <input id="apiKey" type="password" placeholder="Paste your key" autocomplete="off" spellcheck="false" />
        <label for="model">Model</label>
        <input id="model" type="text" spellcheck="false" />
        <p class="small">Your key is saved only in this browser (localStorage) and sent only to that AI company. It never goes to us.</p>
      </div>
      <label class="check"><input type="checkbox" id="alwaysType" /> Always show the text box</label>
      <div class="actions">
        <button type="button" class="pill ghost" id="clearKeys">Forget my keys</button>
        <button type="submit" class="pill" id="saveSettings">Done</button>
      </div>
    </form>
  </dialog>

  <script>
  (function () {
    'use strict';
    const $ = (id) => document.getElementById(id);
    const btn = $('talk'), label = $('label'), status = $('status'), hint = $('hint');
    const captions = $('captions'), typeForm = $('typeForm'), typeInput = $('typeInput');

    // ---------- Daily 5-minute timer (unchanged behaviour) ----------
    const LIMIT_MS = 5 * 60 * 1000;
    function dayKey() {
      const d = new Date();
      return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
    }
    function getUsed() {
      try {
        const raw = localStorage.getItem('callai-used');
        if (!raw) return { day: dayKey(), ms: 0 };
        const data = JSON.parse(raw);
        if (data.day !== dayKey()) return { day: dayKey(), ms: 0 };
        return data;
      } catch (e) { return { day: dayKey(), ms: 0 }; }
    }
    function setUsed(ms) {
      try { localStorage.setItem('callai-used', JSON.stringify({ day: dayKey(), ms })); } catch (e) {}
    }
    function remaining() { return Math.max(0, LIMIT_MS - getUsed().ms); }
    function fmt(ms) {
      const s = Math.ceil(ms / 1000);
      return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    }

    // ---------- Settings (localStorage only) ----------
    const DEFAULT_MODELS = { xai: 'grok-4.7', gemini: 'gemini-flash-latest' };
    const S = {
      get(k, d) { try { const v = localStorage.getItem('callai-' + k); return v === null ? d : v; } catch (e) { return d; } },
      set(k, v) { try { localStorage.setItem('callai-' + k, v); } catch (e) {} },
      del(k) { try { localStorage.removeItem('callai-' + k); } catch (e) {} }
    };
    const settings = {
      get provider() { return S.get('provider', 'free'); },
      get voice() { return S.get('voice', ''); },
      get rate() { return parseFloat(S.get('rate', '1')) || 1; },
      get bargeIn() { return S.get('bargein', '1') === '1'; },
      get alwaysType() { return S.get('alwaystype', '0') === '1'; },
      key(p) { return S.get('key-' + p, ''); },
      model(p) { return S.get('model-' + p, '') || DEFAULT_MODELS[p] || ''; }
    };

    // ---------- Voice output (speechSynthesis) ----------
    const synth = window.speechSynthesis || null;
    let voices = [];
    function scoreVoice(v) {
      const n = (v.name || '') + ' ' + (v.voiceURI || '');
      let s = 0;
      if (/^en[-_]US/i.test(v.lang)) s += 30; else if (/^en/i.test(v.lang)) s += 20; else return -1000;
      if (/natural|neural|online/i.test(n)) s += 50;
      if (/google/i.test(n)) s += 40;
      if (/premium|enhanced/i.test(n)) s += 35;
      if (/samantha|ava|allison|aria|jenny|guy|zira|karen|daniel|serena|siri/i.test(n)) s += 20;
      if (/compact|espeak|novelty|whisper|bad news|bells|bubbles|cellos|zarvox|trinoids|albert|jester|organ|superstar|boing|deranged|hysterical|wobble/i.test(n)) s -= 60;
      if (v.localService === false) s += 5;
      return s;
    }
    function englishVoices() {
      return voices.filter(v => /^en/i.test(v.lang || '')).sort((a, b) => scoreVoice(b) - scoreVoice(a));
    }
    function pickVoice() {
      const list = englishVoices();
      const want = settings.voice;
      if (want) { const v = voices.find(v => v.voiceURI === want || v.name === want); if (v) return v; }
      return list[0] || null;
    }
    function loadVoices() {
      if (!synth) return;
      voices = synth.getVoices() || [];
      fillVoiceSelect();
    }
    if (synth) {
      loadVoices();
      if ('onvoiceschanged' in synth) synth.onvoiceschanged = loadVoices;
      else if (synth.addEventListener) synth.addEventListener('voiceschanged', loadVoices);
    }
    function splitSentences(text) {
      // Split only where . ! ? is followed by a space, so "$121.48" stays whole.
      const parts = String(text).replace(/([.!?]+["')\]]*)\s+/g, '$1\u0001').split('\u0001');
      return parts.map(s => s.trim()).filter(Boolean);
    }
    let speakingText = '';
    function speak(text, onDone) {
      if (!synth || !window.SpeechSynthesisUtterance) { onDone && onDone(); return; }
      synth.cancel();
      speakingText = text;
      const chunks = splitSentences(text);
      const voice = pickVoice();
      let i = 0, finished = false;
      const done = () => { if (finished) return; finished = true; speakingText = ''; onDone && onDone(); };
      speak.cancelCurrent = () => { finished = true; speakingText = ''; synth.cancel(); };
      const next = () => {
        if (finished) return;
        if (i >= chunks.length) return done();
        const u = new SpeechSynthesisUtterance(chunks[i++]);
        if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-US';
        u.rate = settings.rate;
        u.onend = next;
        u.onerror = next;
        synth.speak(u);
      };
      next();
    }
    function stopSpeaking() { if (speak.cancelCurrent) speak.cancelCurrent(); else if (synth) synth.cancel(); }

    // ---------- Listening (Web Speech API) ----------
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
    let rec = null, recActive = false, micBlocked = false;
    function setupRec() {
      if (!SR) return null;
      const r = new SR();
      r.lang = 'en-US';
      r.continuous = false;
      r.interimResults = true;
      r.maxAlternatives = 1;
      r.onstart = () => { recActive = true; };
      r.onresult = onRecResult;
      r.onerror = (e) => {
        const err = e && e.error;
        if (err === 'not-allowed' || err === 'service-not-allowed') {
          micBlocked = true;
          showType(true);
          setHint('Microphone is blocked. Allow the mic for this site, or type below.');
        } else if (err === 'network') {
          setHint('Speech recognition needs an internet connection. You can type below.');
          showType(true);
        }
      };
      r.onend = () => {
        recActive = false;
        clearInterim();
        if (open && !micBlocked && (state === 'listening' || (state === 'speaking' && settings.bargeIn))) {
          setTimeout(ensureListening, 150);
        }
      };
      return r;
    }
    function ensureListening() {
      if (!open || !SR || micBlocked || recActive) return;
      if (!rec) rec = setupRec();
      try { rec.start(); recActive = true; } catch (e) { /* already started */ }
    }
    function stopListening() {
      if (rec && recActive) { try { rec.abort(); } catch (e) {} }
      recActive = false;
    }
    function norm(s) { return (s || '').toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim(); }
    function isEcho(heard) {
      const h = norm(heard);
      if (!h) return true;
      const said = norm(speakingText || lastReply);
      if (said && said.indexOf(h) !== -1) return true;
      // Mostly overlapping words with what we are saying = our own voice leaking into the mic
      const sw = new Set(said.split(' '));
      const hw = h.split(' ');
      const overlap = hw.filter(w => sw.has(w)).length / hw.length;
      return hw.length >= 2 && overlap >= 0.8;
    }
    function onRecResult(e) {
      let finalText = '', interim = '';
      for (let i = e.resultIndex || 0; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
      }
      const heard = (finalText || interim).trim();
      if (!heard) return;
      if (state === 'thinking') return;
      if (state === 'speaking') {
        if (isEcho(heard)) return;
        // Barge-in: user started talking, stop our voice.
        stopSpeaking();
        setState('listening');
      }
      if (finalText.trim()) { clearInterim(); userSaid(finalText.trim()); }
      else showInterim(interim.trim());
    }

    // ---------- Conversation + AI ----------
    const SYSTEM_PROMPT = "You are Call AI, a warm, friendly voice assistant on a live phone-style call. " +
      "Talk like a helpful person on the phone. Keep every answer short: one to three spoken sentences. " +
      "Use plain words only: no markdown, no lists, no emojis, no links, no special symbols. " +
      "If you didn't catch something, ask a quick follow-up question. " +
      "When you ask the caller a yes or no question, end it with: Say one for yes, or two for no.";
    const MAX_TURNS = 10;
    let history = [];
    let lastReply = '';
    let turnId = 0;

    function cleanReply(t) {
      if (!t) return '';
      t = String(t);
      // Drop sponsor/ad footers some free endpoints may append.
      t = t.split(/\n\s*(?:---+|\*\*Sponsor|🌸)/)[0];
      t = t.split('\n').filter(l => !/pollinations\.ai/i.test(l)).join('\n');
      t = t.replace(/```[\s\S]*?```/g, ' ')
           .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
           .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
           .replace(/https?:\/\/\S+/g, '')
           .replace(/[*_`#>~|]+/g, '')
           .replace(/^\s*[-•]\s+/gm, '')
           .replace(/^\s*\d+\.\s+/gm, '')
           .replace(/\s+/g, ' ')
           .trim();
      return t;
    }

    async function fetchJSON(url, opts, ms) {
      const ctl = new AbortController();
      const to = setTimeout(() => ctl.abort(), ms || 30000);
      try {
        const r = await fetch(url, Object.assign({}, opts, { signal: ctl.signal }));
        if (!r.ok) { const err = new Error('HTTP ' + r.status); err.status = r.status; throw err; }
        return await r.json();
      } finally { clearTimeout(to); }
    }

    async function askFree(msgs) {
      // The free endpoint is text-only: flatten any photo parts to their text.
      msgs = msgs.map(m => Array.isArray(m.content) ? { role: m.role, content: m.content.filter(p => p.type === 'text').map(p => p.text).join(' ') } : m);
      // 1st try: Pollinations OpenAI-compatible POST. 2nd try: Pollinations simple GET.
      const body = { model: 'openai', messages: msgs, private: true, referrer: 'call-ai' };
      try {
        const d = await fetchJSON('https://text.pollinations.ai/openai', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
        }, 30000);
        const c = d && d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
        if (c) return c;
      } catch (e) { /* fall through to GET */ }
      await new Promise(r => setTimeout(r, 1500));
      const convo = msgs.filter(m => m.role !== 'system').slice(-6)
        .map(m => (m.role === 'assistant' ? 'Assistant: ' : 'User: ') + m.content).join('\n').slice(-1500) + '\nAssistant:';
      const sys = (msgs[0] && msgs[0].role === 'system') ? String(msgs[0].content).slice(0, 2500) : SYSTEM_PROMPT;
      const url = 'https://text.pollinations.ai/' + encodeURIComponent(convo) +
        '?model=openai&private=true&referrer=call-ai&system=' + encodeURIComponent(sys);
      const ctl = new AbortController();

    function afterCam() {

    function presentPhoto(res, my, note) {

      lastReply = first;
      const hasWords = res.mode === 'vision' || (res.text || '').length > 25;
      if (!hasWords || res.kind === 'other' && !res.text) {
        const all = first + ' ' + (res.short || '');
        if (res.short) addCaption('ai', res.short);
        history.push({ role: 'assistant', content: all });
        setState('speaking');
        speak(all, () => { if (my === camTurn) afterCam(); });
        return;
      }
      const q = 'Do you want me to read it word for word, or just give you the short version? Say one for word for word, or two for the short version.';
      addCaption('ai', q);
      askChoice({ one: 'Word for word', two: 'Short version', fromCam: true, timeoutMs: 12000, defaultChoice: 2,
        onOne: () => readFull(res, my), onTwo: () => readShort(res, my) });
      setState('speaking');
      speak(first + ' ' + q, () => {
        if (my !== camTurn) return;
        afterCam();
        startChoiceTimer();
      });
    }
    function readShort(res, my) {
      if (my !== camTurn) return;
      const t = res.short || 'That\u2019s all.';
      addCaption('ai', t);
      history.push({ role: 'assistant', content: [res.headline, t].join(' ') });
      lastReply = t;
      setState('speaking');
      if (open && settings.bargeIn) setTimeout(() => { if (state === 'speaking') ensureListening(); }, 350);
      speak(t + ' You can ask me anything about it.', () => { if (my === camTurn) afterCam(); });
    }
    async function readFull(res, my) {
      if (my !== camTurn) return;
      let full = res.full || res.text || '';
      if (!full && res.mode === 'vision') {
        setState('thinking'); stopListening();
        camTip.textContent = 'Reading every word\u2026';
        try {
          full = cleanReply(await askAI([{ role: 'system', content: 'Write out all the readable words in this photo, in reading order, as plain text. No comments, no markdown.' },
            { role: 'user', content: [{ type: 'text', text: 'Read this word for word.' }, { type: 'image_url', image_url: { url: res.dataUrl } }] }], 1500));
        } catch (e) { full = ''; }
        if (my !== camTurn) return;
        camTip.textContent = 'Tap the picture to take another.';
        res.full = full;
      }
      if (!full) { addCaption('err', 'I couldn\u2019t read it word for word, so here\u2019s the short version.'); return readShort(res, my); }
      const spoken = full.replace(/\n+/g, '. ').replace(/\.\s*\./g, '.');
      addCaption('ai', 'Word for word: ' + full.replace(/\n+/g, ' / '));
      history.push({ role: 'assistant', content: 'I read it word for word.' });
      lastReply = spoken;
      setState('speaking');
      if (open && settings.bargeIn) setTimeout(() => { if (state === 'speaking') ensureListening(); }, 350);
      speak('Here\u2019s what it says. ' + spoken, () => { if (my === camTurn) afterCam(); });
    }
    typeForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const t = typeInput.value.trim();
      if (!t) return;
      if (!open) { openTalk(); if (!open) return; }
      typeInput.value = '';
      if (state === 'speaking') stopSpeaking();
      if (state === 'thinking') return;
      userSaid(t);
    });

    // ---------- Settings dialog ----------
    const dlg = $('settings'), voiceSel = $('voiceSel'), rate = $('rate'), rateVal = $('rateVal');
    const provider = $('provider'), apiKey = $('apiKey'), model = $('model'), keyBox = $('keyBox'), keyLabel = $('keyLabel');
    const bargeIn = $('bargeIn'), alwaysType = $('alwaysType');
    function fillVoiceSelect() {
      const voiceSel = $('voiceSel');
      const list = englishVoices();
      const cur = pickVoice();
      voiceSel.textContent = '';
      if (!list.length) {
        const o = document.createElement('option'); o.value = ''; o.textContent = synth ? 'Default voice' : 'Voice not supported in this browser';
        voiceSel.appendChild(o); return;
      }
      list.forEach(v => {
        const o = document.createElement('option');
        o.value = v.voiceURI || v.name;
        o.textContent = v.name + ' (' + v.lang + ')';
        if (cur && (cur.voiceURI || cur.name) === o.value) o.selected = true;
        voiceSel.appendChild(o);
      });
    }
    function syncKeyBox() {
      const p = provider.value;
      keyBox.style.display = p === 'free' ? 'none' : '';
      keyLabel.textContent = p === 'xai' ? 'xAI API key (console.x.ai)' : 'Gemini API key (aistudio.google.com)';
      apiKey.value = p === 'free' ? '' : settings.key(p);
      model.value = p === 'free' ? '' : settings.model(p);
      model.placeholder = DEFAULT_MODELS[p] || '';
    }
    function openSettings() {
      fillVoiceSelect();
      rate.value = settings.rate; rateVal.textContent = '(' + settings.rate.toFixed(2) + 'x)';
      provider.value = settings.provider;
      bargeIn.checked = settings.bargeIn;
      alwaysType.checked = settings.alwaysType;
      syncKeyBox();
      if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
    }
    function saveSettings() {
      if (voiceSel.value) S.set('voice', voiceSel.value);
      S.set('rate', String(rate.value));
      S.set('provider', provider.value);
      S.set('bargein', bargeIn.checked ? '1' : '0');
      S.set('alwaystype', alwaysType.checked ? '1' : '0');
      const p = provider.value;
      if (p !== 'free') {
        const k = apiKey.value.trim();
        if (k) S.set('key-' + p, k); else S.del('key-' + p);
        const m = model.value.trim();
        if (m && m !== DEFAULT_MODELS[p]) S.set('model-' + p, m); else S.del('model-' + p);
      }
      if (open) showType(!SR || micBlocked || settings.alwaysType);
    }
    $('gear').addEventListener('click', openSettings);
    provider.addEventListener('change', syncKeyBox);
    rate.addEventListener('input', () => { rateVal.textContent = '(' + parseFloat(rate.value).toFixed(2) + 'x)'; });
    $('testVoice').addEventListener('click', () => {
      if (voiceSel.value) S.set('voice', voiceSel.value);
      S.set('rate', String(rate.value));
      speak('Hi, this is Call AI. How can I help you today?');
    });
    $('clearKeys').addEventListener('click', () => {
      S.del('key-xai'); S.del('key-gemini'); S.del('model-xai'); S.del('model-gemini');
      S.set('provider', 'free'); provider.value = 'free'; syncKeyBox();
    });
    $('settingsForm').addEventListener('submit', saveSettings);

    // Test/debug hook (no secrets exposed)
    window.CallAI = {
      get state() { return state; }, get open() { return open; }, get history() { return history.slice(); },
      get photo() { return photo ? { kind: photo.kind, scam: photo.scam, headline: photo.headline, short: photo.short, mode: photo.mode, text: photo.text } : null; },
      get choice() { return choice ? { one: choice.one, two: choice.two } : null; },
      version: '3.0-camera'
    };
  })();
  </script>
</body>
</html>
